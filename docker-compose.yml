version: '3.8'

services:
  # Main Full-Stack Application (Frontend + Backend + Gemini AI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_grocery_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/smart_grocery_db
      - JWT_SECRET=smart_grocery_super_secret_jwt_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongo
    networks:
      - grocery_net

  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: smart_grocery_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - grocery_net

volumes:
  mongo_data:

networks:
  grocery_net:
    driver: bridge
